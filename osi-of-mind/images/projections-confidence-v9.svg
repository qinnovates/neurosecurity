<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 935" role="img" aria-label="Seven projections placed on a four-level confidence scale; none is rated high"><style>
.surface{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b0b0b}
.title{font-size:17px;font-weight:600}.sub{font-size:12.5px;fill:#52514e}.note{font-size:12px;fill:#52514e}
.lab{font-size:13px}.strong{font-size:13px;font-weight:600}.head{font-size:14px;font-weight:600}
.small{font-size:12px}.muted{font-size:12px;fill:#52514e}.code{font-size:16px;font-weight:700}
.big{font-size:22px;font-weight:600}.inv{font-size:12px;font-weight:700;fill:#fff}
.hair{stroke:#e4e3df;stroke-width:1;fill:none}.rule{stroke:#8a8983;stroke-width:1;fill:none}
.tile{fill:#fff;stroke:#d5d4cf;stroke-width:1}.device{fill:#fff;stroke:#eb6834;stroke-width:3}.proposed{fill:none;stroke:#8a8983;stroke-width:1.5;stroke-dasharray:5 4}
.blue{fill:#2a78d6}.orange{fill:#eb6834}.grey{fill:#a8a7a1}.pale{fill:#eeede9}
.hollow{fill:#fcfcfb;stroke:#8a8983;stroke-width:1.5}.hollow-orange{fill:#fcfcfb;stroke:#eb6834;stroke-width:2}
.s-blue{stroke:#2a78d6;fill:none}.s-orange{stroke:#eb6834;fill:none}.s-ink{stroke:#52514e;fill:none}.s-grey{stroke:#a8a7a1;fill:none}
.ink{fill:#52514e}.badge{fill:#52514e}
@media (prefers-color-scheme:dark){.surface{fill:#1a1a19}text{fill:#fff}.sub,.note,.muted{fill:#c3c2b7}
.hair{stroke:#383835}.tile{fill:#232322;stroke:#44443f}.device{fill:#232322;stroke:#d95926}.pale{fill:#2c2c2a}.hollow,.hollow-orange{fill:#1a1a19}
.blue{fill:#3987e5}.orange{fill:#d95926}.grey{fill:#75746f}.s-blue{stroke:#3987e5}.s-orange{stroke:#d95926}
.s-ink{stroke:#c3c2b7}.ink{fill:#c3c2b7}.badge{fill:#75746f}.inv{fill:#fff}}
</style><rect class="surface" width="800" height="935"/><text class="title" x="24.0" y="34.0" text-anchor="start">Seven projections and the confidence the author gives each</text><text class="sub" x="24.0" y="55.0" text-anchor="start">Projections, not findings. An open diamond marks the author&#x27;s stated confidence. Where a projection has two parts with</text><text class="sub" x="24.0" y="72.0" text-anchor="start">different confidence, each part has its own diamond and label. Listed in the paper&#x27;s order, which is not a ranking.</text><text class="strong" x="24.0" y="113.0" text-anchor="start">Projection</text><text class="strong" x="429.5" y="113.0" text-anchor="middle">Low</text><text class="strong" x="528.5" y="113.0" text-anchor="middle">Low to medium</text><text class="strong" x="627.5" y="113.0" text-anchor="middle">Medium</text><text class="strong" x="726.5" y="113.0" text-anchor="middle">High</text><line class="hair" x1="24.0" y1="125.0" x2="776.0" y2="125.0"/><text class="head" x="24.0" y="149.0" text-anchor="start">P1</text><text class="lab" x="62.0" y="149.0" text-anchor="start">Hyperdimensional classifiers spread in</text><text class="lab" x="62.0" y="165.0" text-anchor="start">low-power biosignal decoding.</text><text class="muted" x="62.0" y="182.0" text-anchor="start">Closest TARA entry: none</text><path class="hollow-orange" d="M627.5 139.0 L635.5 147.0 L627.5 155.0 L619.5 147.0 Z"/><line class="hair" x1="24.0" y1="205.0" x2="776.0" y2="205.0"/><text class="head" x="24.0" y="229.0" text-anchor="start">P2</text><text class="lab" x="62.0" y="229.0" text-anchor="start">The noise tolerance that helps decoders helps</text><text class="lab" x="62.0" y="245.0" text-anchor="start">an adversary&#x27;s readout model equally.</text><text class="muted" x="62.0" y="262.0" text-anchor="start">Closest TARA entries: T0166 (theoretical), T0036</text><text class="muted" x="62.0" y="277.0" text-anchor="start">(emerging)</text><path class="hollow-orange" d="M528.5 219.0 L536.5 227.0 L528.5 235.0 L520.5 227.0 Z"/><line class="hair" x1="24.0" y1="300.0" x2="776.0" y2="300.0"/><text class="head" x="24.0" y="324.0" text-anchor="start">P3</text><text class="lab" x="62.0" y="324.0" text-anchor="start">Models are refined from population to group to</text><text class="lab" x="62.0" y="340.0" text-anchor="start">individual, and back.</text><text class="muted" x="62.0" y="357.0" text-anchor="start">Closest TARA entries: T0041 (demonstrated), T0038</text><text class="muted" x="62.0" y="372.0" text-anchor="start">(emerging)</text><path class="hollow-orange" d="M429.5 314.0 L437.5 322.0 L429.5 330.0 L421.5 322.0 Z"/><text class="small" x="429.5" y="346.0" text-anchor="middle">adversarial use</text><path class="hollow-orange" d="M627.5 314.0 L635.5 322.0 L627.5 330.0 L619.5 322.0 Z"/><text class="small" x="627.5" y="346.0" text-anchor="middle">the transfer</text><text class="small" x="627.5" y="360.0" text-anchor="middle">itself works</text><line class="hair" x1="24.0" y1="395.0" x2="776.0" y2="395.0"/><text class="head" x="24.0" y="419.0" text-anchor="start">P4</text><text class="lab" x="62.0" y="419.0" text-anchor="start">Weaknesses shown in hyperdimensional</text><text class="lab" x="62.0" y="435.0" text-anchor="start">classifiers carry over to neural decoders built on</text><text class="lab" x="62.0" y="451.0" text-anchor="start">them.</text><text class="muted" x="62.0" y="468.0" text-anchor="start">Closest TARA entries: T0019 (demonstrated), T0024</text><text class="muted" x="62.0" y="483.0" text-anchor="start">(demonstrated), T0021 (emerging), T0170</text><text class="muted" x="62.0" y="498.0" text-anchor="start">(theoretical), T0050 (demonstrated)</text><path class="hollow-orange" d="M429.5 409.0 L437.5 417.0 L429.5 425.0 L421.5 417.0 Z"/><text class="small" x="429.5" y="441.0" text-anchor="middle">reachable in a</text><text class="small" x="429.5" y="455.0" text-anchor="middle">fielded device</text><path class="hollow-orange" d="M627.5 409.0 L635.5 417.0 L627.5 425.0 L619.5 417.0 Z"/><text class="small" x="627.5" y="441.0" text-anchor="middle">properties of</text><text class="small" x="627.5" y="455.0" text-anchor="middle">the method</text><line class="hair" x1="24.0" y1="521.0" x2="776.0" y2="521.0"/><text class="head" x="24.0" y="545.0" text-anchor="start">P5</text><text class="lab" x="62.0" y="545.0" text-anchor="start">Small alterations spread across a group are</text><text class="lab" x="62.0" y="561.0" text-anchor="start">harder to see than one large alteration in one</text><text class="lab" x="62.0" y="577.0" text-anchor="start">person.</text><text class="muted" x="62.0" y="594.0" text-anchor="start">Closest TARA entries: T0062 (theoretical), T0047</text><text class="muted" x="62.0" y="609.0" text-anchor="start">(emerging)</text><path class="hollow-orange" d="M429.5 535.0 L437.5 543.0 L429.5 551.0 L421.5 543.0 Z"/><line class="hair" x1="24.0" y1="632.0" x2="776.0" y2="632.0"/><text class="head" x="24.0" y="656.0" text-anchor="start">P6</text><text class="lab" x="62.0" y="656.0" text-anchor="start">High-dimensional representations are useful for</text><text class="lab" x="62.0" y="672.0" text-anchor="start">detecting abnormal inputs and device behaviour.</text><text class="lab" x="62.0" y="688.0" text-anchor="start">Detection, not prediction of attacks.</text><text class="muted" x="62.0" y="705.0" text-anchor="start">Closest TARA entry: none</text><path class="hollow-orange" d="M429.5 646.0 L437.5 654.0 L429.5 662.0 L421.5 654.0 Z"/><text class="small" x="429.5" y="678.0" text-anchor="middle">alteration of</text><text class="small" x="429.5" y="692.0" text-anchor="middle">cognitive state</text><path class="hollow-orange" d="M627.5 646.0 L635.5 654.0 L627.5 662.0 L619.5 654.0 Z"/><text class="small" x="627.5" y="678.0" text-anchor="middle">input and drift</text><text class="small" x="627.5" y="692.0" text-anchor="middle">anomalies</text><line class="hair" x1="24.0" y1="728.0" x2="776.0" y2="728.0"/><text class="head" x="24.0" y="752.0" text-anchor="start">P7</text><text class="lab" x="62.0" y="752.0" text-anchor="start">Brain signals keep being proposed as a login</text><text class="lab" x="62.0" y="768.0" text-anchor="start">factor; its security turns on drift, enrolment and</text><text class="lab" x="62.0" y="784.0" text-anchor="start">replay.</text><text class="muted" x="62.0" y="801.0" text-anchor="start">Closest TARA entries: T0032 (emerging), T0038</text><text class="muted" x="62.0" y="816.0" text-anchor="start">(emerging), T0071 (emerging)</text><path class="hollow-orange" d="M429.5 742.0 L437.5 750.0 L429.5 758.0 L421.5 750.0 Z"/><text class="small" x="429.5" y="774.0" text-anchor="middle">a mainstream</text><text class="small" x="429.5" y="788.0" text-anchor="middle">login</text><path class="hollow-orange" d="M627.5 742.0 L635.5 750.0 L627.5 758.0 L619.5 750.0 Z"/><text class="small" x="627.5" y="774.0" text-anchor="middle">proposals</text><text class="small" x="627.5" y="788.0" text-anchor="middle">continue</text><line class="hair" x1="380.0" y1="125.0" x2="380.0" y2="839.0" stroke-dasharray="2 4"/><line class="hair" x1="479.0" y1="125.0" x2="479.0" y2="839.0" stroke-dasharray="2 4"/><line class="hair" x1="578.0" y1="125.0" x2="578.0" y2="839.0" stroke-dasharray="2 4"/><line class="hair" x1="677.0" y1="125.0" x2="677.0" y2="839.0" stroke-dasharray="2 4"/><line class="hair" x1="776.0" y1="125.0" x2="776.0" y2="839.0" stroke-dasharray="2 4"/><text class="muted" x="726.5" y="161.0" text-anchor="middle">none</text><line class="hair" x1="24.0" y1="839.0" x2="776.0" y2="839.0"/><text class="note" x="24.0" y="859.0" text-anchor="start">No projection is rated high. Confidence levels are the author&#x27;s own judgement and carry no probabilities. The status in brackets after</text><text class="note" x="24.0" y="875.0" text-anchor="start">each TARA entry is that entry&#x27;s catalogue evidence status, which describes the technique and not the projection.</text><text class="note" x="24.0" y="894.0" text-anchor="start">QIF, TARA and NISS are proposed and unvalidated. Sources: whitepaper Section 26 (projection text and confidence);</text><text class="note" x="24.0" y="910.0" text-anchor="start">datalake/qtara-registrar.json version 4.3 (entry statuses).</text></svg>
