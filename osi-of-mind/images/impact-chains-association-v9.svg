<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 572" role="img" aria-label="Diagram of one technique joined to an address, two structures, one pathway and three condition codes, giving six association rows"><style>
.surface{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b0b0b}
.title{font-size:17px;font-weight:600}.sub{font-size:12.5px;fill:#52514e}.note{font-size:12px;fill:#52514e}
.lab{font-size:13px}.strong{font-size:13px;font-weight:600}.head{font-size:14px;font-weight:600}
.small{font-size:12px}.muted{font-size:12px;fill:#52514e}.code{font-size:16px;font-weight:700}
.big{font-size:22px;font-weight:600}.inv{font-size:12px;font-weight:700;fill:#fff}
.hair{stroke:#e4e3df;stroke-width:1;fill:none}.rule{stroke:#8a8983;stroke-width:1;fill:none}
.tile{fill:#fff;stroke:#d5d4cf;stroke-width:1}.device{fill:#fff;stroke:#eb6834;stroke-width:3}.proposed{fill:none;stroke:#8a8983;stroke-width:1.5;stroke-dasharray:5 4}
.blue{fill:#2a78d6}.orange{fill:#eb6834}.grey{fill:#a8a7a1}.pale{fill:#eeede9}
.hollow{fill:#fcfcfb;stroke:#8a8983;stroke-width:1.5}.hollow-orange{fill:#fcfcfb;stroke:#eb6834;stroke-width:2}
.s-blue{stroke:#2a78d6;fill:none}.s-orange{stroke:#eb6834;fill:none}.s-ink{stroke:#52514e;fill:none}.s-grey{stroke:#a8a7a1;fill:none}
.ink{fill:#52514e}.badge{fill:#52514e}
@media (prefers-color-scheme:dark){.surface{fill:#1a1a19}text{fill:#fff}.sub,.note,.muted{fill:#c3c2b7}
.hair{stroke:#383835}.tile{fill:#232322;stroke:#44443f}.device{fill:#232322;stroke:#d95926}.pale{fill:#2c2c2a}.hollow,.hollow-orange{fill:#1a1a19}
.blue{fill:#3987e5}.orange{fill:#d95926}.grey{fill:#75746f}.s-blue{stroke:#3987e5}.s-orange{stroke:#d95926}
.s-ink{stroke:#c3c2b7}.ink{fill:#c3c2b7}.badge{fill:#75746f}.inv{fill:#fff}}
</style><rect class="surface" width="800" height="572"/><text class="title" x="24.0" y="34.0" text-anchor="start">How an impact-chain row is built: joins on a shared address</text><text class="sub" x="24.0" y="55.0" text-anchor="start">One small example, QIF-T0035. Each line is a lookup in a table, not a measured connection. Every path from left to right is</text><text class="sub" x="24.0" y="72.0" text-anchor="start">one row of the dataset. Condition codes are diagnostic category references for threat modeling, not diagnostic claims.</text><text class="strong" x="24.0" y="115.0" text-anchor="start">Technique</text><rect class="tile" x="24.0" y="221.0" width="132.0" height="50.0" rx="6"/><text class="strong" x="34.0" y="241.0" text-anchor="start">QIF-T0035</text><text class="small" x="34.0" y="258.0" text-anchor="start">P300 interrogation</text><text class="strong" x="179.0" y="115.0" text-anchor="start">Address it is tagged</text><text class="strong" x="179.0" y="130.0" text-anchor="start">at</text><rect class="tile" x="179.0" y="221.0" width="132.0" height="50.0" rx="6"/><text class="strong" x="189.0" y="241.0" text-anchor="start">N7</text><text class="small" x="189.0" y="258.0" text-anchor="start">Neocortex</text><text class="strong" x="334.0" y="115.0" text-anchor="start">Structures at that</text><text class="strong" x="334.0" y="130.0" text-anchor="start">address</text><rect class="tile" x="334.0" y="190.0" width="132.0" height="50.0" rx="6"/><text class="small" x="344.0" y="219.0" text-anchor="start">Broca&#x27;s Area</text><rect class="tile" x="334.0" y="252.0" width="132.0" height="50.0" rx="6"/><text class="small" x="344.0" y="281.0" text-anchor="start">Wernicke&#x27;s Area</text><text class="strong" x="489.0" y="115.0" text-anchor="start">Pathways listed for</text><text class="strong" x="489.0" y="130.0" text-anchor="start">them</text><rect class="tile" x="489.0" y="221.0" width="132.0" height="50.0" rx="6"/><text class="small" x="499.0" y="250.0" text-anchor="start">Language Network</text><text class="strong" x="644.0" y="115.0" text-anchor="start">Condition codes the</text><text class="strong" x="644.0" y="130.0" text-anchor="start">pathway lists</text><rect class="tile" x="644.0" y="159.0" width="132.0" height="50.0" rx="6"/><text class="strong" x="654.0" y="179.0" text-anchor="start">R47.01</text><text class="small" x="654.0" y="196.0" text-anchor="start">Aphasia</text><rect class="tile" x="644.0" y="221.0" width="132.0" height="50.0" rx="6"/><text class="strong" x="654.0" y="241.0" text-anchor="start">R47.1</text><text class="small" x="654.0" y="258.0" text-anchor="start">Dysarthria</text><rect class="tile" x="644.0" y="283.0" width="132.0" height="50.0" rx="6"/><text class="strong" x="654.0" y="303.0" text-anchor="start">R48.2</text><text class="small" x="654.0" y="320.0" text-anchor="start">Apraxia of speech</text><line class="s-grey" x1="158.0" y1="246.0" x2="177.0" y2="246.0" stroke-width="1.5"/><text class="muted" x="167.5" y="351.0" text-anchor="middle">is tagged at</text><line class="s-grey" x1="313.0" y1="246.0" x2="332.0" y2="215.0" stroke-width="1.5"/><line class="s-grey" x1="313.0" y1="246.0" x2="332.0" y2="277.0" stroke-width="1.5"/><text class="muted" x="322.5" y="351.0" text-anchor="middle">is the address of</text><line class="s-grey" x1="468.0" y1="215.0" x2="487.0" y2="246.0" stroke-width="1.5"/><line class="s-grey" x1="468.0" y1="277.0" x2="487.0" y2="246.0" stroke-width="1.5"/><text class="muted" x="477.5" y="351.0" text-anchor="middle">is listed on</text><line class="s-grey" x1="623.0" y1="246.0" x2="642.0" y2="184.0" stroke-width="1.5"/><line class="s-grey" x1="623.0" y1="246.0" x2="642.0" y2="246.0" stroke-width="1.5"/><line class="s-grey" x1="623.0" y1="246.0" x2="642.0" y2="308.0" stroke-width="1.5"/><text class="muted" x="632.5" y="351.0" text-anchor="middle">lists</text><line class="hair" x1="24.0" y1="363.0" x2="776.0" y2="363.0"/><text class="big" x="24.0" y="393.0" text-anchor="start">6 rows</text><text class="lab" x="120.0" y="383.0" text-anchor="start">from 1 technique, 1 address, 2 structures, 1 pathway and 3 condition codes. The whole dataset has</text><text class="lab" x="120.0" y="400.0" text-anchor="start">5,546 rows built the same way.</text><text class="strong" x="24.0" y="425.0" text-anchor="start">What a row says</text><text class="lab" x="214.0" y="425.0" text-anchor="start">The technique and the condition code share an address.</text><text class="strong" x="24.0" y="448.0" text-anchor="start">What a row does not say</text><text class="lab" x="214.0" y="448.0" text-anchor="start">That the technique reaches the structure, acts on the pathway, or leads to the condition. No</text><text class="lab" x="214.0" y="465.0" text-anchor="start">row is evidence of an effect in a person.</text><line class="hair" x1="24.0" y1="492.0" x2="776.0" y2="492.0"/><text class="note" x="24.0" y="512.0" text-anchor="start">The example was chosen because it is small. Across the dataset: 91 techniques, 10 structures, 37 pathways and 60 condition</text><text class="note" x="24.0" y="528.0" text-anchor="start">codes appear in at least one row.</text><text class="note" x="24.0" y="547.0" text-anchor="start">QIF, TARA and NISS are proposed and unvalidated. Source: datalake/impact-chains.json.</text></svg>
