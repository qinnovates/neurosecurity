</style><rect class="surface" width="800" height="840"/><text class="title" x="24.0" y="34.0" text-anchor="start">A device on a route: the hyperdirect loop with a lead at the subthalamic nucleus</text><text class="sub" x="24.0" y="55.0" text-anchor="start">Schematic, not anatomy to scale. Staged proposal, not integrated. The device sits at an address (STN, N4). The route is the</text><text class="sub" x="24.0" y="72.0" text-anchor="start">chain it sits on. Line style shows where each hop&#x27;s evidence comes from. The grey code on each box is its address; the</text><text class="sub" x="24.0" y="89.0" text-anchor="start">codes do not run in order along the route.</text><text class="muted" x="24.0" y="128.0" text-anchor="start">First hops to and from the target recorded in other staged routes</text><rect class="tile" x="24.0" y="136.0" width="116.0" height="60.0" rx="6"/><text class="head" x="34.0" y="157.0" text-anchor="start">GPe</text><text class="muted" x="130.0" y="157.0" text-anchor="end">N5</text><text class="muted" x="34.0" y="173.0" text-anchor="start">Globus Pallidus</text><text class="muted" x="34.0" y="186.0" text-anchor="start">Externus</text><rect class="tile" x="342.0" y="136.0" width="116.0" height="60.0" rx="6"/><text class="head" x="352.0" y="157.0" text-anchor="start">SNr</text><text class="muted" x="448.0" y="157.0" text-anchor="end">N2</text><text class="muted" x="352.0" y="173.0" text-anchor="start">Substantia nigra</text><text class="muted" x="352.0" y="186.0" text-anchor="start">pars reticulata</text><rect class="tile" x="24.0" y="246.0" width="116.0" height="60.0" rx="6"/><text class="head" x="34.0" y="267.0" text-anchor="start">M1</text><text class="muted" x="130.0" y="267.0" text-anchor="end">N7</text><text class="muted" x="34.0" y="283.0" text-anchor="start">Primary Motor</text><text class="muted" x="34.0" y="296.0" text-anchor="start">Cortex</text><rect class="pale" x="174.0" y="237.0" width="134.0" height="78.0" rx="12"/><rect class="device" x="183.0" y="246.0" width="116.0" height="60.0" rx="6"/><text class="head" x="193.0" y="267.0" text-anchor="start">STN</text><text class="muted" x="289.0" y="267.0" text-anchor="end">N4</text><text class="muted" x="193.0" y="283.0" text-anchor="start">Subthalamic</text><text class="muted" x="193.0" y="296.0" text-anchor="start">Nucleus</text><rect class="tile" x="342.0" y="246.0" width="116.0" height="60.0" rx="6"/><text class="head" x="352.0" y="267.0" text-anchor="start">GPi</text><text class="muted" x="448.0" y="267.0" text-anchor="end">N5</text><text class="muted" x="352.0" y="283.0" text-anchor="start">Globus Pallidus</text><text class="muted" x="352.0" y="296.0" text-anchor="start">Internus</text><rect class="tile" x="501.0" y="246.0" width="116.0" height="60.0" rx="6"/><text class="head" x="511.0" y="267.0" text-anchor="start">VA/VLa</text><text class="muted" x="607.0" y="267.0" text-anchor="end">N4</text><text class="muted" x="511.0" y="283.0" text-anchor="start">Motor thalamus</text><text class="muted" x="511.0" y="296.0" text-anchor="start">(VA, VLa)</text><rect class="tile" x="660.0" y="206.0" width="116.0" height="60.0" rx="6"/><text class="head" x="670.0" y="227.0" text-anchor="start">SMA</text><text class="muted" x="766.0" y="227.0" text-anchor="end">N7</text><text class="muted" x="670.0" y="243.0" text-anchor="start">Supplementary</text><text class="muted" x="670.0" y="256.0" text-anchor="start">Motor Area</text><rect class="tile" x="660.0" y="286.0" width="116.0" height="60.0" rx="6"/><text class="head" x="670.0" y="307.0" text-anchor="start">M1 (start)</text><text class="muted" x="766.0" y="307.0" text-anchor="end">N7</text><text class="muted" x="670.0" y="323.0" text-anchor="start">Primary Motor</text><text class="muted" x="670.0" y="336.0" text-anchor="start">Cortex</text><line class="s-blue" x1="144.0" y1="276.0" x2="178.0" y2="276.0" stroke-width="3.5"/><path class="s-blue" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" d="M171.0 280.2 L178.0 276.0 L171.0 271.8"/><circle class="blue" cx="161.0" cy="259.0" r="10"/><text class="inv" x="161.0" y="263.0" text-anchor="middle">1</text><line class="s-ink" x1="303.0" y1="276.0" x2="337.0" y2="276.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M330.0 280.2 L337.0 276.0 L330.0 271.8"/><circle class="hollow" cx="320.0" cy="259.0" r="10"/><text class="small" x="320.0" y="263.0" text-anchor="middle">2</text><line class="s-ink" x1="462.0" y1="276.0" x2="496.0" y2="276.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M489.0 280.2 L496.0 276.0 L489.0 271.8"/><circle class="badge" cx="479.0" cy="259.0" r="10"/><text class="inv" x="479.0" y="263.0" text-anchor="middle">3</text><line class="s-ink" x1="621.0" y1="276.0" x2="655.0" y2="236.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M653.7 244.1 L655.0 236.0 L647.3 238.6"/><circle class="badge" cx="638.0" cy="239.0" r="10"/><text class="inv" x="638.0" y="243.0" text-anchor="middle">4</text><line class="s-ink" x1="621.0" y1="276.0" x2="655.0" y2="316.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M647.3 313.4 L655.0 316.0 L653.7 307.9"/><circle class="hollow" cx="638.0" cy="279.0" r="10"/><text class="small" x="638.0" y="283.0" text-anchor="middle">5</text><line class="s-ink" x1="102.0" y1="200.0" x2="209.0" y2="234.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M201.1 235.9 L209.0 234.0 L203.6 227.9"/><circle class="hollow" cx="155.5" cy="200.0" r="10"/><text class="small" x="155.5" y="204.0" text-anchor="middle">a</text><line class="s-ink" x1="273.0" y1="234.0" x2="380.0" y2="202.0" stroke-width="2" stroke-dasharray="6 4"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M374.5 208.0 L380.0 202.0 L372.1 200.0"/><circle class="badge" cx="326.5" cy="201.0" r="10"/><text class="inv" x="326.5" y="205.0" text-anchor="middle">b</text><circle class="hollow-orange" cx="31.0" cy="332.0" r="6" stroke-width="3"/><text class="small" x="46.0" y="336.0" text-anchor="start">Device: a deep brain stimulation lead at the STN. 4 devices in the atlas list</text><text class="small" x="46.0" y="352.0" text-anchor="start">this target.</text><rect class="pale" x="24.0" y="362.0" width="14.0" height="14.0" rx="4"/><text class="small" x="46.0" y="374.0" text-anchor="start">Beside the target (spread in space): the internal capsule, a fibre tract the</text><text class="small" x="46.0" y="390.0" text-anchor="start">staged data records as adjacent to the STN.</text><line class="s-blue" x1="24.0" y1="420.0" x2="66.0" y2="420.0" stroke-width="3.5"/><path class="s-blue" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" d="M59.0 424.2 L66.0 420.0 L59.0 415.8"/><text class="small" x="74.0" y="424.0" text-anchor="start">demonstrated in humans</text><line class="s-ink" x1="250.0" y1="420.0" x2="292.0" y2="420.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M285.0 424.2 L292.0 420.0 L285.0 415.8"/><text class="small" x="300.0" y="424.0" text-anchor="start">non-human primate finding</text><line class="s-ink" x1="490.0" y1="420.0" x2="532.0" y2="420.0" stroke-width="2" stroke-dasharray="6 4"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M525.0 424.2 L532.0 420.0 L525.0 415.8"/><text class="small" x="540.0" y="424.0" text-anchor="start">other animal or mixed species</text><circle class="badge" cx="34.0" cy="446.0" r="9"/><text class="small" x="50.0" y="450.0" text-anchor="start">filled number: source supports the hop</text><circle class="hollow" cx="300.0" cy="446.0" r="9"/><text class="small" x="316.0" y="450.0" text-anchor="start">open number: source partly supports it</text><text class="strong" x="24.0" y="486.0" text-anchor="start"></text><text class="strong" x="52.0" y="486.0" text-anchor="start">Hop</text><text class="strong" x="176.0" y="486.0" text-anchor="start">Effect at synapse</text><text class="strong" x="322.0" y="486.0" text-anchor="start">Cited finding</text><text class="strong" x="520.0" y="486.0" text-anchor="start">Source check</text><text class="strong" x="640.0" y="486.0" text-anchor="start">In humans</text><line class="hair" x1="24.0" y1="494.0" x2="776.0" y2="494.0"/><text class="small" x="24.0" y="512.0" text-anchor="start">1</text><text class="small" x="52.0" y="512.0" text-anchor="start">M1 → STN</text><text class="small" x="176.0" y="512.0" text-anchor="start">excites · glutamate</text><text class="small" x="322.0" y="512.0" text-anchor="start">human, physiology</text><text class="small" x="520.0" y="512.0" text-anchor="start">supported</text><text class="small" x="640.0" y="512.0" text-anchor="start">demonstrated</text><line class="hair" x1="24.0" y1="520.0" x2="776.0" y2="520.0"/><text class="small" x="24.0" y="538.0" text-anchor="start">2</text><text class="small" x="52.0" y="538.0" text-anchor="start">STN → GPi</text><text class="small" x="176.0" y="538.0" text-anchor="start">excites · glutamate</text><text class="small" x="322.0" y="538.0" text-anchor="start">non-human primate, physiology</text><text class="small" x="520.0" y="538.0" text-anchor="start">partly supported</text><text class="small" x="640.0" y="538.0" text-anchor="start">inferred by homology</text><line class="hair" x1="24.0" y1="546.0" x2="776.0" y2="546.0"/><text class="small" x="24.0" y="564.0" text-anchor="start">3</text><text class="small" x="52.0" y="564.0" text-anchor="start">GPi → VA/VLa</text><text class="small" x="176.0" y="564.0" text-anchor="start">inhibits · GABA</text><text class="small" x="322.0" y="564.0" text-anchor="start">non-human primate, tracing</text><text class="small" x="520.0" y="564.0" text-anchor="start">supported</text><text class="small" x="640.0" y="564.0" text-anchor="start">inferred by homology</text><line class="hair" x1="24.0" y1="572.0" x2="776.0" y2="572.0"/><text class="small" x="24.0" y="590.0" text-anchor="start">4</text><text class="small" x="52.0" y="590.0" text-anchor="start">VA/VLa → SMA</text><text class="small" x="176.0" y="590.0" text-anchor="start">excites · glutamate</text><text class="small" x="322.0" y="590.0" text-anchor="start">non-human primate, tracing</text><text class="small" x="520.0" y="590.0" text-anchor="start">supported</text><text class="small" x="640.0" y="590.0" text-anchor="start">inferred by homology</text><line class="hair" x1="24.0" y1="598.0" x2="776.0" y2="598.0"/><text class="small" x="24.0" y="616.0" text-anchor="start">5</text><text class="small" x="52.0" y="616.0" text-anchor="start">VA/VLa → M1</text><text class="small" x="176.0" y="616.0" text-anchor="start">excites · glutamate</text><text class="small" x="322.0" y="616.0" text-anchor="start">non-human primate, tracing</text><text class="small" x="520.0" y="616.0" text-anchor="start">partly supported</text><text class="small" x="640.0" y="616.0" text-anchor="start">inferred by homology</text><line class="hair" x1="24.0" y1="624.0" x2="776.0" y2="624.0"/><text class="small" x="24.0" y="642.0" text-anchor="start">a</text><text class="small" x="52.0" y="642.0" text-anchor="start">GPe → STN</text><text class="small" x="176.0" y="642.0" text-anchor="start">inhibits · GABA</text><text class="small" x="322.0" y="642.0" text-anchor="start">non-human primate, physiology</text><text class="small" x="520.0" y="642.0" text-anchor="start">partly supported</text><text class="small" x="640.0" y="642.0" text-anchor="start">inferred by homology</text><text class="muted" x="52.0" y="657.0" text-anchor="start">recorded in: Cortico-basal ganglia loop, indirect</text><line class="hair" x1="24.0" y1="665.0" x2="776.0" y2="665.0"/><text class="small" x="24.0" y="683.0" text-anchor="start">b</text><text class="small" x="52.0" y="683.0" text-anchor="start">STN → SNr</text><text class="small" x="176.0" y="683.0" text-anchor="start">excites · glutamate</text><text class="small" x="322.0" y="683.0" text-anchor="start">mixed species, review</text><text class="small" x="520.0" y="683.0" text-anchor="start">supported</text><text class="small" x="640.0" y="683.0" text-anchor="start">inferred by homology</text><text class="muted" x="52.0" y="698.0" text-anchor="start">recorded in: Basal ganglia nigral output</text><line class="hair" x1="24.0" y1="712.0" x2="776.0" y2="712.0"/><text class="note" x="24.0" y="732.0" text-anchor="start">A map of where to look, not a prediction of harm. No study of a deliberately tampered implant in a person was found, and no attack</text><text class="note" x="24.0" y="748.0" text-anchor="start">path in a person has been demonstrated. Hops are not transitive across a structure, and the sign of a hop is not the net effect of</text><text class="note" x="24.0" y="764.0" text-anchor="start">stimulation.</text><text class="note" x="24.0" y="783.0" text-anchor="start">QIF, TARA and NISS are proposed and unvalidated. The routes have not been reviewed by a human neuroanatomist. Sources:</text><text class="note" x="24.0" y="799.0" text-anchor="start">_staging/2026-10-refresh/neural-structure-delta.json (routes_v2, tracts_v2); datalake/qif-brain-bci-atlas.json</text><text class="note" x="24.0" y="815.0" text-anchor="start">(device_region_mappings).</text></svg>
