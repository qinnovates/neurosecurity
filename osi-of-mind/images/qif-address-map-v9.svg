<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 823" role="img" aria-label="Twelve tiles, one per QIF address code, grouped by nervous system, interface and device, with no order among them"><style>
.surface{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b0b0b}
.title{font-size:17px;font-weight:600}.sub{font-size:12.5px;fill:#52514e}.note{font-size:12px;fill:#52514e}
.lab{font-size:13px}.strong{font-size:13px;font-weight:600}.head{font-size:14px;font-weight:600}
.small{font-size:12px}.muted{font-size:12px;fill:#52514e}.code{font-size:16px;font-weight:700}
.big{font-size:22px;font-weight:600}.inv{font-size:12px;font-weight:700;fill:#fff}
.hair{stroke:#e4e3df;stroke-width:1;fill:none}.rule{stroke:#8a8983;stroke-width:1;fill:none}
.tile{fill:#fff;stroke:#d5d4cf;stroke-width:1}.device{fill:#fff;stroke:#eb6834;stroke-width:3}.proposed{fill:none;stroke:#8a8983;stroke-width:1.5;stroke-dasharray:5 4}
.blue{fill:#2a78d6}.orange{fill:#eb6834}.grey{fill:#a8a7a1}.pale{fill:#eeede9}
.hollow{fill:#fcfcfb;stroke:#8a8983;stroke-width:1.5}.hollow-orange{fill:#fcfcfb;stroke:#eb6834;stroke-width:2}
.s-blue{stroke:#2a78d6;fill:none}.s-orange{stroke:#eb6834;fill:none}.s-ink{stroke:#52514e;fill:none}.s-grey{stroke:#a8a7a1;fill:none}
.ink{fill:#52514e}.badge{fill:#52514e}
@media (prefers-color-scheme:dark){.surface{fill:#1a1a19}text{fill:#fff}.sub,.note,.muted{fill:#c3c2b7}
.hair{stroke:#383835}.tile{fill:#232322;stroke:#44443f}.device{fill:#232322;stroke:#d95926}.pale{fill:#2c2c2a}.hollow,.hollow-orange{fill:#1a1a19}
.blue{fill:#3987e5}.orange{fill:#d95926}.grey{fill:#75746f}.s-blue{stroke:#3987e5}.s-orange{stroke:#d95926}
.s-ink{stroke:#c3c2b7}.ink{fill:#c3c2b7}.badge{fill:#75746f}.inv{fill:#fff}}
</style><rect class="surface" width="800" height="823"/><text class="title" x="24.0" y="34.0" text-anchor="start">QIF addresses: 11 codes in use and 1 proposed</text><text class="sub" x="24.0" y="55.0" text-anchor="start">An address says where a structure or a component is. Tiles are in alphabetical order by name within each group. The numbers</text><text class="sub" x="24.0" y="72.0" text-anchor="start">in the codes are identifiers: they carry no order, severity, processing or traversal meaning. Bars count catalogue techniques</text><text class="sub" x="24.0" y="89.0" text-anchor="start">tagged at each address.</text><text class="strong" x="24.0" y="128.0" text-anchor="start">In the nervous system (N codes, addressing version 2)</text><rect class="tile" x="24.0" y="138.0" width="181.0" height="189.0" rx="8"/><text class="code" x="36.0" y="162.0" text-anchor="start">N6</text><text class="head" x="70.0" y="162.0" text-anchor="start">Allocortex</text><text class="muted" x="36.0" y="182.0" text-anchor="start">Allocortex, mesocortex</text><text class="muted" x="36.0" y="197.0" text-anchor="start">(periallocortex and</text><text class="muted" x="36.0" y="212.0" text-anchor="start">proisocortex) and pallial</text><text class="muted" x="36.0" y="227.0" text-anchor="start">nuclei, including</text><text class="muted" x="36.0" y="242.0" text-anchor="start">basolateral amygdala.</text><text class="small" x="36.0" y="285.0" text-anchor="start">5 structure records</text><rect class="blue" x="36.0" y="293.0" width="94.6" height="6.0" rx="3"/><text class="small" x="36.0" y="315.0" text-anchor="start">44 techniques tagged</text><rect class="tile" x="214.3" y="138.0" width="181.0" height="189.0" rx="8"/><text class="code" x="226.3" y="162.0" text-anchor="start">N2</text><text class="head" x="260.3" y="162.0" text-anchor="start">Brainstem</text><text class="muted" x="226.3" y="182.0" text-anchor="start">Midbrain, pons and</text><text class="muted" x="226.3" y="197.0" text-anchor="start">medulla, including</text><text class="muted" x="226.3" y="212.0" text-anchor="start">substantia nigra and</text><text class="muted" x="226.3" y="227.0" text-anchor="start">ventral tegmental area.</text><text class="small" x="226.3" y="270.0" text-anchor="start">6 structure records</text><text class="small" x="226.3" y="285.0" text-anchor="start">2 moved here from N5</text><rect class="blue" x="226.3" y="293.0" width="66.7" height="6.0" rx="3"/><text class="small" x="226.3" y="315.0" text-anchor="start">31 techniques tagged</text><rect class="tile" x="404.6" y="138.0" width="181.0" height="189.0" rx="8"/><text class="code" x="416.6" y="162.0" text-anchor="start">N3</text><text class="head" x="450.6" y="162.0" text-anchor="start">Cerebellum</text><text class="muted" x="416.6" y="182.0" text-anchor="start">Cerebellar cortex and</text><text class="muted" x="416.6" y="197.0" text-anchor="start">nuclei.</text><text class="small" x="416.6" y="285.0" text-anchor="start">3 structure records</text><rect class="blue" x="416.6" y="293.0" width="62.4" height="6.0" rx="3"/><text class="small" x="416.6" y="315.0" text-anchor="start">29 techniques tagged</text><rect class="tile" x="594.9" y="138.0" width="181.0" height="189.0" rx="8"/><text class="code" x="606.9" y="162.0" text-anchor="start">N5</text><text class="head" x="640.9" y="162.0" text-anchor="start">Cerebral nuclei</text><text class="muted" x="606.9" y="182.0" text-anchor="start">Subpallial nuclei: striatum,</text><text class="muted" x="606.9" y="197.0" text-anchor="start">pallidum, basal forebrain,</text><text class="muted" x="606.9" y="212.0" text-anchor="start">central and medial</text><text class="muted" x="606.9" y="227.0" text-anchor="start">amygdala.</text><text class="small" x="606.9" y="285.0" text-anchor="start">4 structure records</text><rect class="blue" x="606.9" y="293.0" width="58.1" height="6.0" rx="3"/><text class="small" x="606.9" y="315.0" text-anchor="start">27 techniques tagged</text><rect class="tile" x="24.0" y="336.3" width="181.0" height="189.0" rx="8"/><text class="code" x="36.0" y="360.3" text-anchor="start">N4</text><text class="head" x="70.0" y="360.3" text-anchor="start">Diencephalon</text><text class="muted" x="36.0" y="380.3" text-anchor="start">Thalamus, subthalamus,</text><text class="muted" x="36.0" y="395.3" text-anchor="start">hypothalamus,</text><text class="muted" x="36.0" y="410.3" text-anchor="start">epithalamus (Terminologia</text><text class="muted" x="36.0" y="425.3" text-anchor="start">Anatomica 1998</text><text class="muted" x="36.0" y="440.3" text-anchor="start">divisions).</text><text class="small" x="36.0" y="468.3" text-anchor="start">5 structure records</text><text class="small" x="36.0" y="483.3" text-anchor="start">1 moved here from N5</text><rect class="blue" x="36.0" y="491.3" width="51.6" height="6.0" rx="3"/><text class="small" x="36.0" y="513.3" text-anchor="start">24 techniques tagged</text><rect class="tile" x="214.3" y="336.3" width="181.0" height="189.0" rx="8"/><text class="code" x="226.3" y="360.3" text-anchor="start">N7</text><text class="head" x="260.3" y="360.3" text-anchor="start">Neocortex</text><text class="muted" x="226.3" y="380.3" text-anchor="start">Isocortex, including</text><text class="muted" x="226.3" y="395.3" text-anchor="start">agranular motor areas.</text><text class="small" x="226.3" y="483.3" text-anchor="start">10 structure records</text><rect class="blue" x="226.3" y="491.3" width="124.7" height="6.0" rx="3"/><text class="small" x="226.3" y="513.3" text-anchor="start">58 techniques tagged</text><rect class="proposed" x="404.6" y="336.3" width="181.0" height="189.0" rx="8"/><text class="code" x="416.6" y="360.3" text-anchor="start">PER</text><text class="head" x="460.6" y="360.3" text-anchor="start">Periphery</text><text class="muted" x="416.6" y="380.3" text-anchor="start">Outside brain and spinal</text><text class="muted" x="416.6" y="395.3" text-anchor="start">cord: for example retina,</text><text class="muted" x="416.6" y="410.3" text-anchor="start">optic nerve, cochlea.</text><text class="small" x="416.6" y="468.3" text-anchor="start">15 staged structure records</text><text class="small" x="416.6" y="483.3" text-anchor="start">proposed, not integrated</text><text class="muted" x="416.6" y="513.3" text-anchor="start">no techniques tagged</text><rect class="tile" x="594.9" y="336.3" width="181.0" height="189.0" rx="8"/><text class="code" x="606.9" y="360.3" text-anchor="start">N1</text><text class="head" x="640.9" y="360.3" text-anchor="start">Spinal cord</text><text class="muted" x="606.9" y="380.3" text-anchor="start">Spinal cord parenchyma;</text><text class="muted" x="606.9" y="395.3" text-anchor="start">roots and ganglia are</text><text class="muted" x="606.9" y="410.3" text-anchor="start">outside it.</text><text class="small" x="606.9" y="483.3" text-anchor="start">5 structure records</text><rect class="blue" x="606.9" y="491.3" width="109.7" height="6.0" rx="3"/><text class="small" x="606.9" y="513.3" text-anchor="start">51 techniques tagged</text><text class="strong" x="24.0" y="554.6" text-anchor="start">At the electrode (I0)</text><text class="strong" x="214.3" y="554.6" text-anchor="start">In the device (S codes)</text><rect class="tile" x="24.0" y="564.6" width="181.0" height="129.0" rx="8"/><text class="code" x="36.0" y="588.6" text-anchor="start">I0</text><text class="head" x="70.0" y="588.6" text-anchor="start">Neural Interface</text><text class="muted" x="36.0" y="608.6" text-anchor="start">Electrode-tissue boundary</text><text class="muted" x="36.0" y="623.6" text-anchor="start">where biological signals</text><text class="muted" x="36.0" y="638.6" text-anchor="start">become electronic.</text><rect class="blue" x="36.0" y="659.6" width="135.5" height="6.0" rx="3"/><text class="small" x="36.0" y="681.6" text-anchor="start">63 techniques tagged</text><rect class="tile" x="214.3" y="564.6" width="181.0" height="129.0" rx="8"/><text class="code" x="226.3" y="588.6" text-anchor="start">S1</text><text class="head" x="260.3" y="588.6" text-anchor="start">Analog Front-End</text><text class="muted" x="226.3" y="608.6" text-anchor="start">Amplification, filtering,</text><text class="muted" x="226.3" y="623.6" text-anchor="start">ADC/DAC conversion.</text><rect class="blue" x="226.3" y="659.6" width="120.4" height="6.0" rx="3"/><text class="small" x="226.3" y="681.6" text-anchor="start">56 techniques tagged</text><rect class="tile" x="404.6" y="564.6" width="181.0" height="129.0" rx="8"/><text class="code" x="416.6" y="588.6" text-anchor="start">S3</text><text class="head" x="450.6" y="588.6" text-anchor="start">Application</text><text class="muted" x="416.6" y="608.6" text-anchor="start">Clinical software, user</text><text class="muted" x="416.6" y="623.6" text-anchor="start">interface, data storage,</text><text class="muted" x="416.6" y="638.6" text-anchor="start">network.</text><rect class="blue" x="416.6" y="659.6" width="116.1" height="6.0" rx="3"/><text class="small" x="416.6" y="681.6" text-anchor="start">54 techniques tagged</text><rect class="tile" x="594.9" y="564.6" width="181.0" height="129.0" rx="8"/><text class="code" x="606.9" y="588.6" text-anchor="start">S2</text><text class="head" x="640.9" y="588.6" text-anchor="start">Digital Processing</text><text class="muted" x="606.9" y="608.6" text-anchor="start">Decoding algorithms,</text><text class="muted" x="606.9" y="623.6" text-anchor="start">classification, digital</text><text class="muted" x="606.9" y="638.6" text-anchor="start">signal processing.</text><rect class="blue" x="606.9" y="659.6" width="157.0" height="6.0" rx="3"/><text class="small" x="606.9" y="681.6" text-anchor="start">73 techniques tagged</text><line class="hair" x1="24.0" y1="710.9" x2="776.0" y2="710.9"/><text class="note" x="24.0" y="730.9" text-anchor="start">A technique can be tagged at several addresses, so the counts add to more than the 173 techniques in the catalogue. A count is</text><text class="note" x="24.0" y="746.9" text-anchor="start">how many catalogue entries carry the tag. It is not a measure of risk at that address.</text><text class="note" x="24.0" y="765.9" text-anchor="start">The dashed tile is the proposed periphery code, staged and not integrated. No human neuroanatomist has reviewed the addressing</text><text class="note" x="24.0" y="781.9" text-anchor="start">model. QIF, TARA and NISS are proposed and unvalidated. Sources: datalake/qif-brain-bci-atlas.json;</text><text class="note" x="24.0" y="797.9" text-anchor="start">datalake/qtara-registrar.json; _staging/2026-10-refresh/neural-structure-delta.json.</text></svg>
