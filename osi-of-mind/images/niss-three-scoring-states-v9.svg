427.8"/><line class="hair" x1="552.0" y1="432.0" x2="762.0" y2="432.0"/><line class="hair" x1="552.0" y1="428.0" x2="552.0" y2="436.0"/><line class="hair" x1="657.0" y1="428.0" x2="657.0" y2="436.0"/><line class="hair" x1="762.0" y1="428.0" x2="762.0" y2="436.0"/><text class="small" x="552.0" y="468.0" text-anchor="start">No score: its only source is a preprint.</text><line class="hair" x1="24.0" y1="492.0" x2="776.0" y2="492.0"/><text class="note" x="24.0" y="512.0" text-anchor="start">Metrics: BI Biological Impact · CR Cognitive Reconnaissance · CD Cognitive/Functional Disruption · CV Consent Violation · RV</text><text class="note" x="24.0" y="528.0" text-anchor="start">Reversibility · NP Neuroplasticity. Each takes 0, 3.3, 6.7 or 10. The score is the weighted mean, rounded up to one decimal</text><text class="note" x="24.0" y="544.0" text-anchor="start">(ceil(score * 10) / 10). Scores and ranges shown were recomputed from that formula and match the stored values.</text><text class="note" x="24.0" y="563.0" text-anchor="start">QIF, TARA and NISS are proposed and unvalidated. NISS scores are for threat modeling, not clinical or diagnostic use. Source:</text><text class="note" x="24.0" y="579.0" text-anchor="start">datalake/qtara-registrar.json version 4.3 (niss_spec 1.1).</text></svg>
