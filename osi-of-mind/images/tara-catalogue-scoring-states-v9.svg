<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 457" role="img" aria-label="Bar chart of TARA techniques by evidence status, split by NISS scoring state"><style>
.surface{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b0b0b}
