@media (prefers-color-scheme:dark){.surface{fill:#1a1a19}text{fill:#fff}.sub,.note,.muted{fill:#c3c2b7}
.hair{stroke:#383835}.tile{fill:#232322;stroke:#44443f}.device{fill:#232322;stroke:#d95926}.pale{fill:#2c2c2a}.hollow,.hollow-orange{fill:#1a1a19}
.blue{fill:#3987e5}.orange{fill:#d95926}.grey{fill:#75746f}.s-blue{stroke:#3987e5}.s-orange{stroke:#d95926}
.s-ink{stroke:#c3c2b7}.ink{fill:#c3c2b7}.badge{fill:#75746f}.inv{fill:#fff}}
</style><rect class="surface" width="800" height="457"/><text class="title" x="24.0" y="34.0" text-anchor="start">The TARA catalogue by evidence status and scoring state</text><text class="sub" x="24.0" y="55.0" text-anchor="start">173 techniques and 1 variant. Evidence status says what has been shown about a technique. Scoring state says how much of</text><text class="sub" x="24.0" y="72.0" text-anchor="start">its NISS score the sources support. The two are recorded separately.</text><rect class="blue" x="24.0" y="94.0" width="14.0" height="14.0" rx="3"/><text class="small" x="46.0" y="105.0" text-anchor="start">Scored: all six NISS metrics supported by the entry&#x27;s sources</text><rect class="orange" x="24.0" y="114.0" width="14.0" height="14.0" rx="3"/><text class="small" x="46.0" y="125.0" text-anchor="start">Provisional: some metrics supported; the entry holds a range</text><rect class="hollow" x="24.0" y="134.0" width="14.0" height="14.0" rx="3"/><text class="small" x="46.0" y="145.0" text-anchor="start">Unscored: no peer-reviewed source, or no metric supported</text><text class="lab" x="138.0" y="193.0" text-anchor="end">All techniques</text><rect class="blue" x="150.0" y="177.0" width="273.9" height="22.0" rx="3"/><rect class="orange" x="425.9" y="177.0" width="19.4" height="22.0" rx="3"/><rect class="hollow" x="448.0" y="177.8" width="69.2" height="20.5" rx="3"/><text class="strong" x="530.0" y="188.0" text-anchor="start">173</text><text class="muted" x="530.0" y="203.0" text-anchor="start">129 scored · 10 provisional · 34 unscored</text><line class="hair" x1="24.0" y1="219.0" x2="776.0" y2="219.0"/><text class="muted" x="24.0" y="239.0" text-anchor="start">By evidence status</text><text class="lab" x="138.0" y="267.0" text-anchor="end">Theoretical</text><rect class="blue" x="150.0" y="251.0" width="145.6" height="22.0" rx="3"/><rect class="orange" x="297.6" y="251.0" width="6.6" height="22.0" rx="3"/><rect class="hollow" x="306.9" y="251.8" width="50.0" height="20.5" rx="3"/><text class="strong" x="369.6" y="262.0" text-anchor="start">98</text><text class="muted" x="369.6" y="277.0" text-anchor="start">69 scored · 4 provisional · 25 unscored</text><text class="lab" x="138.0" y="307.0" text-anchor="end">Emerging</text><rect class="blue" x="150.0" y="291.0" width="42.9" height="22.0" rx="3"/><rect class="orange" x="194.9" y="291.0" width="2.3" height="22.0" rx="3"/><rect class="hollow" x="199.9" y="291.8" width="5.1" height="20.5" rx="3"/><text class="strong" x="217.7" y="302.0" text-anchor="start">27</text><text class="muted" x="217.7" y="317.0" text-anchor="start">21 scored · 2 provisional · 4 unscored</text><text class="lab" x="138.0" y="347.0" text-anchor="end">Demonstrated</text><rect class="blue" x="150.0" y="331.0" width="81.4" height="22.0" rx="3"/><rect class="orange" x="233.4" y="331.0" width="6.6" height="22.0" rx="3"/><rect class="hollow" x="242.7" y="331.8" width="7.2" height="20.5" rx="3"/><text class="strong" x="262.7" y="342.0" text-anchor="start">48</text><text class="muted" x="262.7" y="357.0" text-anchor="start">39 scored · 4 provisional · 5 unscored</text><line class="hair" x1="24.0" y1="377.0" x2="776.0" y2="377.0"/><text class="note" x="24.0" y="397.0" text-anchor="start">Bar length is the number of techniques, on one scale. 3 earlier techniques with legacy statuses (speculative, plausible) are counted</text><text class="note" x="24.0" y="413.0" text-anchor="start">as theoretical. An unscored or provisional technique has no severity rating; the chart is not a ranking.</text><text class="note" x="24.0" y="432.0" text-anchor="start">QIF, TARA and NISS are proposed and unvalidated. Source: datalake/qtara-registrar.json version 4.3.</text></svg>
