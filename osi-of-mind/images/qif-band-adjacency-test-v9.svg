<rect class="grey" x="174.7" y="308.2" width="23.9" height="28.8" rx="2"/>
<rect class="grey" x="200.6" y="293.9" width="23.9" height="43.1" rx="2"/>
<rect class="grey" x="226.6" y="267.4" width="23.9" height="69.6" rx="2"/>
<text class="muted" x="238.5" y="355.0" text-anchor="middle">19%</text>
<rect class="grey" x="252.5" y="231.8" width="23.9" height="105.2" rx="2"/>
<rect class="grey" x="278.4" y="209.1" width="23.9" height="127.9" rx="2"/>
<rect class="grey" x="304.3" y="175.8" width="23.9" height="161.2" rx="2"/>
