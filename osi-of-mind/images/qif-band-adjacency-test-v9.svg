</style><rect class="surface" width="800" height="487"/><text class="title" x="24.0" y="34.0" text-anchor="start">Does the N-code numbering predict which codes a pathway joins?</text><text class="sub" x="24.0" y="55.0" text-anchor="start">65 links between different N codes, from 46 pathway records. Each bar counts how many of the 5,040 possible numberings of</text><text class="sub" x="24.0" y="72.0" text-anchor="start">the seven codes give that share of links between adjacent numbers. The published numbering is the blue bar.</text><line class="hair" x1="70.0" y1="287.2" x2="770.0" y2="287.2"/><text class="muted" x="62.0" y="291.2" text-anchor="end">120</text><line class="hair" x1="70.0" y1="237.4" x2="770.0" y2="237.4"/><text class="muted" x="62.0" y="241.4" text-anchor="end">240</text><line class="hair" x1="70.0" y1="187.6" x2="770.0" y2="187.6"/><text class="muted" x="62.0" y="191.6" text-anchor="end">360</text><line class="hair" x1="70.0" y1="137.8" x2="770.0" y2="137.8"/><text class="muted" x="62.0" y="141.8" text-anchor="end">480</text><rect class="grey" x="71.0" y="336.2" width="23.9" height="0.8" rx="2"/><rect class="grey" x="96.9" y="334.5" width="23.9" height="2.5" rx="2"/><rect class="grey" x="122.9" y="329.5" width="23.9" height="7.5" rx="2"/><rect class="grey" x="148.8" y="320.4" width="23.9" height="16.6" rx="2"/><rect class="grey" x="174.7" y="306.3" width="23.9" height="30.7" rx="2"/><rect class="grey" x="200.6" y="287.2" width="23.9" height="49.8" rx="2"/><rect class="grey" x="226.6" y="264.0" width="23.9" height="73.0" rx="2"/><rect class="grey" x="252.5" y="241.6" width="23.9" height="95.4" rx="2"/><rect class="grey" x="278.4" y="230.8" width="23.9" height="106.2" rx="2"/><rect class="grey" x="304.3" y="202.6" width="23.9" height="134.4" rx="2"/><rect class="grey" x="330.3" y="188.5" width="23.9" height="148.5" rx="2"/><rect class="grey" x="356.2" y="156.1" width="23.9" height="180.9" rx="2"/><rect class="blue" x="382.1" y="137.0" width="23.9" height="200.0" rx="2"/><rect class="grey" x="408.0" y="156.9" width="23.9" height="180.1" rx="2"/><rect class="grey" x="434.0" y="165.2" width="23.9" height="171.8" rx="2"/><rect class="grey" x="459.9" y="177.7" width="23.9" height="159.3" rx="2"/><rect class="grey" x="485.8" y="189.3" width="23.9" height="147.7" rx="2"/><rect class="grey" x="511.7" y="231.6" width="23.9" height="105.4" rx="2"/><rect class="grey" x="537.7" y="249.0" width="23.9" height="88.0" rx="2"/><rect class="grey" x="563.6" y="270.6" width="23.9" height="66.4" rx="2"/><rect class="grey" x="589.5" y="289.7" width="23.9" height="47.3" rx="2"/><rect class="grey" x="615.4" y="294.7" width="23.9" height="42.3" rx="2"/><rect class="grey" x="641.4" y="322.1" width="23.9" height="14.9" rx="2"/><rect class="grey" x="667.3" y="324.6" width="23.9" height="12.4" rx="2"/><rect class="grey" x="693.2" y="332.0" width="23.9" height="5.0" rx="2"/><rect class="grey" x="719.1" y="333.7" width="23.9" height="3.3" rx="2"/><rect class="grey" x="745.1" y="336.2" width="23.9" height="0.8" rx="2"/><line class="rule" x1="95.9" y1="337.0" x2="95.9" y2="342.0"/><text class="muted" x="95.9" y="356.0" text-anchor="middle">10%</text><line class="rule" x1="264.4" y1="337.0" x2="264.4" y2="342.0"/><text class="muted" x="264.4" y="356.0" text-anchor="middle">20%</text><line class="rule" x1="433.0" y1="337.0" x2="433.0" y2="342.0"/><text class="muted" x="433.0" y="356.0" text-anchor="middle">30%</text><line class="rule" x1="601.5" y1="337.0" x2="601.5" y2="342.0"/><text class="muted" x="601.5" y="356.0" text-anchor="middle">40%</text><line class="rule" x1="770.0" y1="337.0" x2="770.0" y2="342.0"/><text class="muted" x="770.0" y="356.0" text-anchor="middle">50%</text><line class="rule" x1="70.0" y1="337.0" x2="770.0" y2="337.0"/><text class="lab" x="420.0" y="377.0" text-anchor="middle">Share of links that join numerically adjacent codes</text><text class="lab" transform="translate(20 222) rotate(-90)" text-anchor="middle">Numberings</text><line class="s-blue" x1="394.1" y1="131.0" x2="394.1" y2="111.0" stroke-width="1.5"/><text class="strong" x="402.1" y="119.0" text-anchor="start">The published numbering: 18 of 65 links (28%)</text><line class="hair" x1="24.0" y1="391.0" x2="776.0" y2="391.0"/><text class="note" x="24.0" y="411.0" text-anchor="start">Average over all numberings: 29%. 60% of numberings give a share at least as high as the published one. The numbers N1 to N7 are</text><text class="note" x="24.0" y="427.0" text-anchor="start">kept as identifiers; they carry no order, severity or traversal meaning.</text><text class="note" x="24.0" y="446.0" text-anchor="start">A link is one origin band paired with one target band of a pathway record; links within a single code are left out. QIF, TARA and</text><text class="note" x="24.0" y="462.0" text-anchor="start">NISS are proposed and unvalidated. Source: datalake/qif-neural-pathways.json.</text></svg>
