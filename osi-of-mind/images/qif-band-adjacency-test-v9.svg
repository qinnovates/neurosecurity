<rect class="grey" x="356.2" y="145.6" width="23.9" height="191.4" rx="2"/>
<rect class="grey" x="382.1" y="153.9" width="23.9" height="183.1" rx="2"/>
<text class="muted" x="394.1" y="355.0" text-anchor="middle">29%</text>
<rect class="grey" x="408.0" y="173.6" width="23.9" height="163.4" rx="2"/>
<rect class="blue" x="434.0" y="172.8" width="23.9" height="164.2" rx="2"/>
<text class="strong" x="445.9" y="164.8" text-anchor="middle">32.3%</text>
