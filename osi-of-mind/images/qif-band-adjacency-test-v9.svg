<text class="muted" x="388.5" y="114.0">average of all numberings, 28.6%</text>
<text class="muted" x="420.0" y="377.0" text-anchor="middle">Share of cross-code links joining adjacent numbers</text>
<text class="strong" x="24.0" y="435.0">Published numbering: 21 of 63 links (33.3%).</text>
<text class="sub" x="24.0" y="455.0">27.6% of all numberings place at least as many links on adjacent numbers,</text><text class="sub" x="24.0" y="473.0">so the published order carries no traversal information.</text>
