<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 487" role="img" aria-label="Histogram of adjacent-link share across every numbering of the seven N codes, with the published numbering marked">
<style>
.surface{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b0b0b}
.title{font-size:17px;font-weight:600}.sub{font-size:12.5px;fill:#52514e}.muted{font-size:12px;fill:#52514e}
.strong{font-size:13px;font-weight:600}.hair{stroke:#e4e3df;stroke-width:1;fill:none}.rule{stroke:#8a8983;stroke-width:1;fill:none}
.blue{fill:#2a78d6}.grey{fill:#a8a7a1}.s-ink{stroke:#52514e;fill:none;stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){.surface{fill:#1a1a19}text{fill:#fff}.sub,.muted{fill:#c3c2b7}
.hair{stroke:#383835}.blue{fill:#3987e5}.grey{fill:#75746f}.s-ink{stroke:#c3c2b7}}
</style>
<rect class="surface" width="800" height="487"/>
<text class="title" x="24.0" y="34.0">Does the N-code numbering predict which codes a pathway joins?</text>
<text class="sub" x="24.0" y="55.0">64 links between different N codes, from 45 pathway records. Each bar counts how many of the 5,040 possible numberings of</text>
<text class="sub" x="24.0" y="72.0">the seven codes give that share of links between adjacent numbers. The published numbering is the blue bar.</text>
<line class="hair" x1="70.0" y1="280.2" x2="770.0" y2="280.2"/>
<text class="muted" x="62.0" y="284.2" text-anchor="end">150</text>
<line class="hair" x1="70.0" y1="223.5" x2="770.0" y2="223.5"/>
<text class="muted" x="62.0" y="227.5" text-anchor="end">300</text>
<line class="hair" x1="70.0" y1="166.8" x2="770.0" y2="166.8"/>
<text class="muted" x="62.0" y="170.8" text-anchor="end">450</text>
<line class="hair" x1="70.0" y1="110.0" x2="770.0" y2="110.0"/>
<text class="muted" x="62.0" y="114.0" text-anchor="end">600</text>
<rect class="grey" x="71.0" y="336.2" width="24.9" height="0.8" rx="2"/>
<text class="muted" x="83.5" y="355.0" text-anchor="middle">9%</text>
<rect class="grey" x="97.9" y="334.7" width="24.9" height="2.3" rx="2"/>
<rect class="grey" x="124.8" y="330.2" width="24.9" height="6.8" rx="2"/>
<rect class="grey" x="151.8" y="321.9" width="24.9" height="15.1" rx="2"/>
<text class="muted" x="164.2" y="355.0" text-anchor="middle">14%</text>
<rect class="grey" x="178.7" y="309.0" width="24.9" height="28.0" rx="2"/>
<rect class="grey" x="205.6" y="291.6" width="24.9" height="45.4" rx="2"/>
<rect class="grey" x="232.5" y="269.7" width="24.9" height="67.3" rx="2"/>
<text class="muted" x="245.0" y="355.0" text-anchor="middle">19%</text>
<rect class="grey" x="259.5" y="246.2" width="24.9" height="90.8" rx="2"/>
<rect class="grey" x="286.4" y="238.6" width="24.9" height="98.4" rx="2"/>
<rect class="grey" x="313.3" y="206.1" width="24.9" height="130.9" rx="2"/>
