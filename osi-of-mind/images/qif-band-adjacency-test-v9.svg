<line class="rule" x1="70.0" y1="337.0" x2="770.0" y2="337.0"/>
<line class="s-ink" x1="386.7" y1="104.0" x2="386.7" y2="337.0"/>
<text class="muted" x="392.7" y="114.0">average of all numberings, 28.6%</text>
<text class="muted" x="420.0" y="377.0" text-anchor="middle">Share of cross-code links joining adjacent numbers</text>
<text class="strong" x="24.0" y="435.0">Published numbering: 20 of 62 links (32.3%).</text>
<text class="sub" x="24.0" y="455.0">32.9% of all numberings place at least as many links on adjacent numbers,</text><text class="sub" x="24.0" y="473.0">so the published order carries no traversal information.</text>
</svg>
