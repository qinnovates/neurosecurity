<rect class="blue" x="367.2" y="160.7" width="24.9" height="176.3" rx="2"/>
<text class="strong" x="379.6" y="152.7" text-anchor="middle">26.6%</text>
<rect class="grey" x="394.1" y="150.1" width="24.9" height="186.9" rx="2"/>
<text class="muted" x="406.5" y="355.0" text-anchor="middle">28%</text>
<rect class="grey" x="421.0" y="166.0" width="24.9" height="171.0" rx="2"/>
<rect class="grey" x="447.9" y="174.3" width="24.9" height="162.7" rx="2"/>
<rect class="grey" x="474.8" y="185.7" width="24.9" height="151.3" rx="2"/>
<text class="muted" x="487.3" y="355.0" text-anchor="middle">33%</text>
<rect class="grey" x="501.8" y="203.8" width="24.9" height="133.2" rx="2"/>
<rect class="grey" x="528.7" y="248.5" width="24.9" height="88.5" rx="2"/>
<rect class="grey" x="555.6" y="270.4" width="24.9" height="66.6" rx="2"/>
<text class="muted" x="568.1" y="355.0" text-anchor="middle">38%</text>
<rect class="grey" x="582.5" y="275.7" width="24.9" height="61.3" rx="2"/>
<rect class="grey" x="609.5" y="299.9" width="24.9" height="37.1" rx="2"/>
<rect class="grey" x="636.4" y="318.8" width="24.9" height="18.2" rx="2"/>
<text class="muted" x="648.8" y="355.0" text-anchor="middle">42%</text>
<rect class="grey" x="663.3" y="324.1" width="24.9" height="12.9" rx="2"/>
