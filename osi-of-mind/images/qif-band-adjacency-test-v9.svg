<text class="muted" x="471.9" y="355.0" text-anchor="middle">34%</text>
<rect class="grey" x="485.8" y="225.0" width="23.9" height="112.0" rx="2"/>
<rect class="grey" x="511.7" y="252.3" width="23.9" height="84.7" rx="2"/>
<rect class="grey" x="537.7" y="284.8" width="23.9" height="52.2" rx="2"/>
<text class="muted" x="549.6" y="355.0" text-anchor="middle">39%</text>
<rect class="grey" x="563.6" y="301.4" width="23.9" height="35.6" rx="2"/>
<rect class="grey" x="589.5" y="317.3" width="23.9" height="19.7" rx="2"/>
<rect class="grey" x="615.4" y="325.6" width="23.9" height="11.4" rx="2"/>
