.s-ink{stroke:#c3c2b7}.ink{fill:#c3c2b7}.badge{fill:#75746f}.inv{fill:#fff}}
</style><rect class="surface" width="800" height="752"/><text class="title" x="24.0" y="34.0" text-anchor="start">Brain-to-vehicle research systems: where three hypothetical scenarios would act</text><text class="sub" x="24.0" y="55.0" text-anchor="start">Schematic of the components the sources describe. These are research systems; none is a production feature. Lettered circles</text><text class="sub" x="24.0" y="72.0" text-anchor="start">mark where each scenario from the author&#x27;s essay would act. None of the three has been demonstrated against a vehicle.</text><line class="rule" x1="334.0" y1="121.0" x2="776.0" y2="121.0"/><text class="muted" x="555.0" y="114.0" text-anchor="middle">addresses S1 to S3</text><rect class="tile" x="24.0" y="131.0" width="132.0" height="88.0" rx="8"/><text class="head" x="36.0" y="155.0" text-anchor="start">Driver</text><text class="muted" x="36.0" y="173.0" text-anchor="start">brain activity</text><text class="muted" x="36.0" y="187.0" text-anchor="start">before an intended</text><text class="muted" x="36.0" y="201.0" text-anchor="start">movement</text><text class="muted" x="90.0" y="114.0" text-anchor="middle">address N7</text><rect class="tile" x="179.0" y="131.0" width="132.0" height="88.0" rx="8"/><text class="head" x="191.0" y="155.0" text-anchor="start">EEG headset</text><text class="muted" x="191.0" y="173.0" text-anchor="start">dry sensors, worn</text><text class="muted" x="191.0" y="187.0" text-anchor="start">by the driver</text><text class="muted" x="245.0" y="114.0" text-anchor="middle">address I0</text><rect class="tile" x="334.0" y="131.0" width="132.0" height="88.0" rx="8"/><text class="head" x="346.0" y="155.0" text-anchor="start">Wireless link</text><text class="muted" x="346.0" y="173.0" text-anchor="start">Bluetooth, per the</text><text class="muted" x="346.0" y="187.0" text-anchor="start">headset maker</text><rect class="tile" x="489.0" y="131.0" width="132.0" height="88.0" rx="8"/><text class="head" x="501.0" y="155.0" text-anchor="start">Decoder</text><text class="muted" x="501.0" y="173.0" text-anchor="start">classifier,</text><text class="muted" x="501.0" y="187.0" text-anchor="start">calibrated for each</text><text class="muted" x="501.0" y="201.0" text-anchor="start">driver</text><rect class="tile" x="644.0" y="131.0" width="132.0" height="88.0" rx="8"/><text class="head" x="656.0" y="155.0" text-anchor="start">Vehicle</text><text class="muted" x="656.0" y="173.0" text-anchor="start">begins steering or</text><text class="muted" x="656.0" y="187.0" text-anchor="start">braking early</text><line class="s-ink" x1="159.0" y1="175.0" x2="175.0" y2="175.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M168.0 179.2 L175.0 175.0 L168.0 170.8"/><line class="s-ink" x1="314.0" y1="175.0" x2="330.0" y2="175.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M323.0 179.2 L330.0 175.0 L323.0 170.8"/><line class="s-ink" x1="469.0" y1="175.0" x2="485.0" y2="175.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M478.0 179.2 L485.0 175.0 L478.0 170.8"/><line class="s-ink" x1="624.0" y1="175.0" x2="640.0" y2="175.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M633.0 179.2 L640.0 175.0 L633.0 170.8"/><rect class="tile" x="305.0" y="263.0" width="190.0" height="88.0" rx="8"/><text class="head" x="317.0" y="287.0" text-anchor="start">Dashboard display</text><text class="muted" x="317.0" y="305.0" text-anchor="start">stimuli the driver sees</text><path class="s-ink" d="M710.0 222.0 L710.0 307.0" stroke-width="2"/><line class="s-ink" x1="710.0" y1="307.0" x2="499.0" y2="307.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M506.0 302.8 L499.0 307.0 L506.0 311.2"/><path class="s-ink" d="M302.0 307.0 L90.0 307.0" stroke-width="2"/><line class="s-ink" x1="90.0" y1="307.0" x2="90.0" y2="223.0" stroke-width="2"/><path class="s-ink" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M94.2 230.0 L90.0 223.0 L85.8 230.0"/><circle class="orange" cx="462.0" cy="133.0" r="12" stroke="#fcfcfb" stroke-width="2"/><text class="inv" x="462.0" y="137.5" text-anchor="middle">A</text><circle class="orange" cx="617.0" cy="133.0" r="12" stroke="#fcfcfb" stroke-width="2"/><text class="inv" x="617.0" y="137.5" text-anchor="middle">B</text><circle class="orange" cx="197.5" cy="307.0" r="12" stroke="#fcfcfb" stroke-width="2"/><text class="inv" x="197.5" y="311.5" text-anchor="middle">C</text><line class="hair" x1="24.0" y1="373.0" x2="776.0" y2="373.0"/><circle class="orange" cx="36.0" cy="391.0" r="12" stroke="#fcfcfb" stroke-width="2"/><text class="inv" x="36.0" y="395.5" text-anchor="middle">A</text><text class="strong" x="60.0" y="395.0" text-anchor="start">The link between headset and car, if it is not authenticated</text><text class="small" x="60.0" y="413.0" text-anchor="start">Scenario: A forged &quot;about to brake&quot; signal reaches the car.</text><text class="muted" x="60.0" y="430.0" text-anchor="start">Closest TARA entries and their catalogue status: QIF-T0004 Man-in-the-middle (demonstrated); QIF-T0067 Phase</text><text class="muted" x="60.0" y="445.0" text-anchor="start">dynamics replay/mimicry (demonstrated)</text><line class="hair" x1="24.0" y1="458.0" x2="776.0" y2="458.0"/><circle class="orange" cx="36.0" cy="476.0" r="12" stroke="#fcfcfb" stroke-width="2"/><text class="inv" x="36.0" y="480.5" text-anchor="middle">B</text><text class="strong" x="60.0" y="480.0" text-anchor="start">The classifier, or its calibration</text><text class="small" x="60.0" y="498.0" text-anchor="start">Scenario: A drowsy driver is classified as alert.</text><text class="muted" x="60.0" y="515.0" text-anchor="start">Closest TARA entries and their catalogue status: QIF-T0019 Universal adversarial perturbation (demonstrated); QIF-T0058</text><text class="muted" x="60.0" y="530.0" text-anchor="start">Calibration poisoning (demonstrated)</text><line class="hair" x1="24.0" y1="543.0" x2="776.0" y2="543.0"/><circle class="orange" cx="36.0" cy="561.0" r="12" stroke="#fcfcfb" stroke-width="2"/><text class="inv" x="36.0" y="565.5" text-anchor="middle">C</text><text class="strong" x="60.0" y="565.0" text-anchor="start">The driver, through stimuli on a screen</text><text class="small" x="60.0" y="583.0" text-anchor="start">Scenario: The dashboard elicits a brain response the driver did not choose to give.</text><text class="muted" x="60.0" y="600.0" text-anchor="start">Closest TARA entries and their catalogue status: QIF-T0035 P300 interrogation (demonstrated); QIF-T0103 SSVEP</text><text class="muted" x="60.0" y="615.0" text-anchor="start">Frequency Hijack via Imperceptible Display Flicker (demonstrated)</text><line class="hair" x1="24.0" y1="640.0" x2="776.0" y2="640.0"/><text class="note" x="24.0" y="660.0" text-anchor="start">In all three the target is electronics, software or stimuli; none requires contact with the brain. Catalogue status describes the</text><text class="note" x="24.0" y="676.0" text-anchor="start">technique in general, not an attack on a vehicle or on a driver. A decoded intention is a probability, and an actuator should not move</text><text class="note" x="24.0" y="692.0" text-anchor="start">on it alone.</text><text class="note" x="24.0" y="711.0" text-anchor="start">QIF, TARA and NISS are proposed and unvalidated. Sources: whitepaper Section 25 (components and scenarios, from company</text><text class="note" x="24.0" y="727.0" text-anchor="start">and essay sources); datalake/qtara-registrar.json version 4.3 (technique names and statuses).</text></svg>
