<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 697" role="img" aria-label="Three lists: what is applied in the repository, what is staged as a proposal, and nine open items"><style>
.surface{fill:#fcfcfb}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b0b0b}
.title{font-size:17px;font-weight:600}.sub{font-size:12.5px;fill:#52514e}.note{font-size:12px;fill:#52514e}
.lab{font-size:13px}.strong{font-size:13px;font-weight:600}.head{font-size:14px;font-weight:600}
.small{font-size:12px}.muted{font-size:12px;fill:#52514e}.code{font-size:16px;font-weight:700}
.big{font-size:22px;font-weight:600}.inv{font-size:12px;font-weight:700;fill:#fff}
.hair{stroke:#e4e3df;stroke-width:1;fill:none}.rule{stroke:#8a8983;stroke-width:1;fill:none}
.tile{fill:#fff;stroke:#d5d4cf;stroke-width:1}.device{fill:#fff;stroke:#eb6834;stroke-width:3}.proposed{fill:none;stroke:#8a8983;stroke-width:1.5;stroke-dasharray:5 4}
.blue{fill:#2a78d6}.orange{fill:#eb6834}.grey{fill:#a8a7a1}.pale{fill:#eeede9}
.hollow{fill:#fcfcfb;stroke:#8a8983;stroke-width:1.5}.hollow-orange{fill:#fcfcfb;stroke:#eb6834;stroke-width:2}
.s-blue{stroke:#2a78d6;fill:none}.s-orange{stroke:#eb6834;fill:none}.s-ink{stroke:#52514e;fill:none}.s-grey{stroke:#a8a7a1;fill:none}
.ink{fill:#52514e}.badge{fill:#52514e}
@media (prefers-color-scheme:dark){.surface{fill:#1a1a19}text{fill:#fff}.sub,.note,.muted{fill:#c3c2b7}
.hair{stroke:#383835}.tile{fill:#232322;stroke:#44443f}.device{fill:#232322;stroke:#d95926}.pale{fill:#2c2c2a}.hollow,.hollow-orange{fill:#1a1a19}
.blue{fill:#3987e5}.orange{fill:#d95926}.grey{fill:#75746f}.s-blue{stroke:#3987e5}.s-orange{stroke:#d95926}
.s-ink{stroke:#c3c2b7}.ink{fill:#c3c2b7}.badge{fill:#75746f}.inv{fill:#fff}}
</style><rect class="surface" width="800" height="697"/><text class="title" x="24.0" y="34.0" text-anchor="start">Where QIF stands: applied, staged and open</text><text class="sub" x="24.0" y="55.0" text-anchor="start">Solid outline: in the repository now. Dashed outline: a staged proposal that is not integrated. Shaded: the nine open items,</text><text class="sub" x="24.0" y="72.0" text-anchor="start">numbered as labels for reference and not as a ranking. Nothing here has been independently reviewed or adopted.</text><rect class="tile" x="24.0" y="105.0" width="242.7" height="478.0" rx="8"/><text class="head" x="38.0" y="129.0" text-anchor="start">Applied in the repository</text><rect class="blue" x="38.0" y="165.0" width="11.0" height="11.0" rx="3"/><text class="small" x="58.0" y="175.0" text-anchor="start">173 techniques and 1 variant,</text><text class="small" x="58.0" y="191.0" text-anchor="start">each with an evidence status</text><text class="small" x="58.0" y="207.0" text-anchor="start">and a scoring state</text><rect class="blue" x="38.0" y="221.0" width="11.0" height="11.0" rx="3"/><text class="small" x="58.0" y="231.0" text-anchor="start">Three scoring states: 129</text><text class="small" x="58.0" y="247.0" text-anchor="start">scored, 10 provisional, 34</text><text class="small" x="58.0" y="263.0" text-anchor="start">unscored</text><rect class="blue" x="38.0" y="277.0" width="11.0" height="11.0" rx="3"/><text class="small" x="58.0" y="287.0" text-anchor="start">Addressing version 2: 3</text><text class="small" x="58.0" y="303.0" text-anchor="start">structures moved, 38 structure</text><text class="small" x="58.0" y="319.0" text-anchor="start">records with addresses</text><rect class="blue" x="38.0" y="333.0" width="11.0" height="11.0" rx="3"/><text class="small" x="58.0" y="343.0" text-anchor="start">23 hazard entries, held apart</text><text class="small" x="58.0" y="359.0" text-anchor="start">from techniques</text><rect class="blue" x="38.0" y="373.0" width="11.0" height="11.0" rx="3"/><text class="small" x="58.0" y="383.0" text-anchor="start">5,546 impact-chain rows,</text><text class="small" x="58.0" y="399.0" text-anchor="start">labelled as associations and</text><text class="small" x="58.0" y="415.0" text-anchor="start">not as paths</text><rect class="blue" x="38.0" y="429.0" width="11.0" height="11.0" rx="3"/><text class="small" x="58.0" y="439.0" text-anchor="start">68 companies and 71 devices</text><text class="small" x="58.0" y="455.0" text-anchor="start">in the inventory</text><rect class="proposed" x="278.7" y="105.0" width="242.7" height="478.0" rx="8"/><text class="head" x="292.7" y="129.0" text-anchor="start">Staged proposal, not</text><text class="head" x="292.7" y="146.0" text-anchor="start">integrated</text><rect class="hollow-orange" x="293.7" y="166.0" width="9.0" height="9.0" rx="3"/><text class="small" x="312.7" y="175.0" text-anchor="start">17 routes with 90 hops, each</text><text class="small" x="312.7" y="191.0" text-anchor="start">hop carrying its own evidence</text><rect class="hollow-orange" x="293.7" y="206.0" width="9.0" height="9.0" rx="3"/><text class="small" x="312.7" y="215.0" text-anchor="start">The periphery code PER, with</text><text class="small" x="312.7" y="231.0" text-anchor="start">15 structure records</text><rect class="hollow-orange" x="293.7" y="246.0" width="9.0" height="9.0" rx="3"/><text class="small" x="312.7" y="255.0" text-anchor="start">69 added structure records in all</text><rect class="hollow-orange" x="293.7" y="270.0" width="9.0" height="9.0" rx="3"/><text class="small" x="312.7" y="279.0" text-anchor="start">5 tracts and 2 broadcasts</text><rect class="hollow-orange" x="293.7" y="294.0" width="9.0" height="9.0" rx="3"/><text class="small" x="312.7" y="303.0" text-anchor="start">The publishing gate for routes:</text><text class="small" x="312.7" y="319.0" text-anchor="start">in the check script, not yet in</text><text class="small" x="312.7" y="335.0" text-anchor="start">the build</text><rect class="hollow-orange" x="293.7" y="350.0" width="9.0" height="9.0" rx="3"/><text class="small" x="312.7" y="359.0" text-anchor="start">A refresh of the CVE mappings</text><rect class="hollow-orange" x="293.7" y="374.0" width="9.0" height="9.0" rx="3"/><text class="small" x="312.7" y="383.0" text-anchor="start">Two brain-to-vehicle inventory</text><text class="small" x="312.7" y="399.0" text-anchor="start">proposals</text><rect class="pale" x="533.3" y="105.0" width="242.7" height="478.0" rx="8"/><text class="head" x="547.3" y="129.0" text-anchor="start">Open items (Section 28.3)</text><text class="strong" x="547.3" y="175.0" text-anchor="start">1</text><text class="small" x="567.3" y="175.0" text-anchor="start">No human neuroanatomist has</text><text class="small" x="567.3" y="191.0" text-anchor="start">reviewed the addressing model</text><text class="strong" x="547.3" y="215.0" text-anchor="start">2</text><text class="small" x="567.3" y="215.0" text-anchor="start">The route records are staged,</text><text class="small" x="567.3" y="231.0" text-anchor="start">not integrated</text><text class="strong" x="547.3" y="255.0" text-anchor="start">3</text><text class="small" x="567.3" y="255.0" text-anchor="start">Most route evidence is from</text><text class="small" x="567.3" y="271.0" text-anchor="start">animals: 3 of 90 hops are</text><text class="small" x="567.3" y="287.0" text-anchor="start">demonstrated in humans</text><text class="strong" x="547.3" y="311.0" text-anchor="start">4</text><text class="small" x="567.3" y="311.0" text-anchor="start">The cortical boundary needs</text><text class="small" x="567.3" y="327.0" text-anchor="start">typing from one histological</text><text class="small" x="567.3" y="343.0" text-anchor="start">parcellation</text><text class="strong" x="547.3" y="367.0" text-anchor="start">5</text><text class="small" x="567.3" y="367.0" text-anchor="start">Whether a numbered stack</text><text class="small" x="567.3" y="383.0" text-anchor="start">misleads engineers is untested</text><text class="strong" x="547.3" y="407.0" text-anchor="start">6</text><text class="small" x="567.3" y="407.0" text-anchor="start">Fourteen depth-and-gating</text><text class="small" x="567.3" y="423.0" text-anchor="start">conclusions are under review</text><text class="strong" x="547.3" y="447.0" text-anchor="start">7</text><text class="small" x="567.3" y="447.0" text-anchor="start">5 new techniques rest on</text><text class="small" x="567.3" y="463.0" text-anchor="start">preprints</text><text class="strong" x="547.3" y="487.0" text-anchor="start">8</text><text class="small" x="567.3" y="487.0" text-anchor="start">The 129 existing scores were</text><text class="small" x="567.3" y="503.0" text-anchor="start">not re-examined under the strict</text><text class="small" x="567.3" y="519.0" text-anchor="start">rule</text><text class="strong" x="547.3" y="543.0" text-anchor="start">9</text><text class="small" x="567.3" y="543.0" text-anchor="start">No model from another provider</text><text class="small" x="567.3" y="559.0" text-anchor="start">has checked this work</text><line class="hair" x1="24.0" y1="601.0" x2="776.0" y2="601.0"/><text class="note" x="24.0" y="621.0" text-anchor="start">Counts are read from the data files when the figure is generated. Item wording follows whitepaper Sections 20.2, 28.2 and 28.3.</text><text class="note" x="24.0" y="640.0" text-anchor="start">QIF, TARA and NISS are proposed and unvalidated. Sources: datalake/qtara-registrar.json; datalake/qif-brain-bci-atlas.json;</text><text class="note" x="24.0" y="656.0" text-anchor="start">datalake/qif-hazards.json; datalake/impact-chains.json; datalake/bci-landscape.json;</text><text class="note" x="24.0" y="672.0" text-anchor="start">_staging/2026-10-refresh/neural-structure-delta.json.</text></svg>
