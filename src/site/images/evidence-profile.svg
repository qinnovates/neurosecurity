<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 272" width="1200" height="272" role="img" aria-label="Evidence and physics-feasibility profile of the 176 catalogued techniques.">
<rect width="1200" height="272" rx="18" fill="#0b1120"/>
<text x="32" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e6ebf5">What the catalogue is actually made of</text>
<text x="32" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#93a1bd">78 of 176 techniques rest on a lab or case demonstration in the literature; the rest are modelled or proposed. Nothing here is validated.</text>
