name: Security Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job reads the tree and runs a build. It previously had
# no permissions block and inherited the repository default.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false
          # Full history: the identity check derives protected names from git authorship,
          # and a depth-1 clone with a bot-authored HEAD would leave it nothing to check.
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      # Runs before npm ci so a leak fails fast, before any third-party code executes.
      - name: No workstation identity, secrets or internal material in tracked files
        run: python3 src/scripts/verify/check_identity_leaks.py --github
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.4'
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Generate KQL JSON
        run: node src/scripts/generate-kql-json.mjs
      - name: Test
        run: npm test
      - name: Atlas pipeline tests that need only the standard library
        # The imaging stack is not installed here, so the meshing, registration and overlay tests skip themselves.
        # What runs: the buildability rule against the registry, the fetch rules, the notices, and the committed
        # manifest against the registry, the build plan and the pipeline's code hash.
        run: |
          python3 -m venv "$RUNNER_TEMP/atlas-venv"
          "$RUNNER_TEMP/atlas-venv/bin/python" -m pip install --quiet --require-hashes -r src/scripts/atlas-pipeline/requirements-dev.txt
          "$RUNNER_TEMP/atlas-venv/bin/python" -I -m pytest -p no:cacheprovider -rs src/scripts/atlas-pipeline/tests
      - name: Build
        run: npm run build
      - name: Check tool page isolation and first-load budgets
        run: npm run check:post-build
      - name: Type check
        run: npm run type-check
