name: Security Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job reads the tree and runs a build. It previously had
# no permissions block and inherited the repository default.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      # Runs before npm ci so a leak fails fast, before any third-party code executes.
      - name: No workstation identity or secrets in tracked files
        run: python3 src/scripts/verify/check_identity_leaks.py --github
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Build
        run: npm run build
