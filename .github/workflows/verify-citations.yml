name: Verify Citations & Facts

on:
  pull_request:
    paths:
      - 'research/paper/**'
      - 'research/blog/**'
      - 'datalake/qtara-registrar.json'
      - 'src/lib/whitepaper-stats.ts'
      - 'osi-of-mind/**'
  push:
    branches: [main]
    paths:
      - 'research/blog/**'
      - 'osi-of-mind/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run verification pipeline
        run: python3 src/scripts/verify/run_all.py --ci

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verify-report
          path: verify-report.json
