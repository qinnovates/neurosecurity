name: Live Header Check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Compare live headers with the repository policy
        run: node src/scripts/check-live-headers.mjs

      - name: Confirm no analytics tag is injected before consent
        run: node src/scripts/check-live-injection.mjs
