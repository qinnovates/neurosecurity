name: Registrar Sync Check

on:
  push:
    branches: [main]
    paths:
      - 'datalake/qtara-registrar.json'
      - 'src/lib/threat-data.ts'
      - 'src/lib/kql-tables.ts'
      - 'datalake/qtara/src/qtara/models.py'
      - 'src/site/learn/autodidactive/js/data/tara.js'
  pull_request:
    paths:
      - 'datalake/qtara-registrar.json'
      - 'src/site/learn/autodidactive/js/data/tara.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Validate registrar JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('datalake/qtara-registrar.json'))
          print(f'Valid JSON: {len(d[\"techniques\"])} techniques')
          "

      - name: Check technique field presence
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('datalake/qtara-registrar.json'))
          errors = []
          for t in d['techniques']:
              tid = t.get('id', 'UNKNOWN')
              if 'technique' not in t and 'attack' not in t:
                  errors.append(f'{tid}: missing both technique and attack fields')
              if 'tara_alias' in t and not t['tara_alias'].startswith('TARA-'):
                  errors.append(f'{tid}: tara_alias must start with TARA-')
              if 'tara_domain_primary' in t:
                  valid = ['VIS','AUD','SOM','VES','MOT','EMO','COG','MEM','LNG','AUT','IDN','SIL']
                  if t['tara_domain_primary'] not in valid:
                      errors.append(f'{tid}: invalid domain {t[\"tara_domain_primary\"]}')
              if 'tara_mode' in t:
                  if t['tara_mode'] not in ['R','M','D']:
                      errors.append(f'{tid}: invalid mode {t[\"tara_mode\"]}')
              if 'tara_drift' in t and t['tara_drift']:
                  if t['tara_drift'] not in ['A','C','L','P']:
                      errors.append(f'{tid}: invalid drift {t[\"tara_drift\"]}')
              # getPhysicsFeasibilityStats() defaults a missing tier to 0, so a
              # technique with no block is silently counted 'feasible now'.
              physics = t.get('physics_feasibility')
              if not physics:
                  errors.append(f'{tid}: missing physics_feasibility block')
              elif not physics.get('timeline'):
                  errors.append(f'{tid}: physics_feasibility has no timeline; the SDK model requires it')
              # status is the legacy field; evidence.tier is what displays read.
              evidence = t.get('evidence')
              valid_tiers = ['validated_rct','validated_replication','demonstrated_lab','demonstrated_case','theoretical_modeled','theoretical_proposed','speculative']
              if not evidence or not evidence.get('tier'):
                  errors.append(f'{tid}: missing evidence.tier; run npm run evidence:tier')
              elif evidence['tier'] not in valid_tiers:
                  errors.append(f'{tid}: unknown evidence tier {evidence["tier"]!r}')
              elif evidence.get('population') not in ['neural_product','adjacent_clinical','adjacent_component','adjacent_domain','none']:
                  errors.append(f'{tid}: unknown evidence population {evidence.get(\"population\")!r}')
              elif (evidence.get('population') == 'neural_product') != (evidence.get('neural_product_cve_count', 0) > 0):
                  errors.append(f'{tid}: population {evidence.get(\"population\")!r} disagrees with neural_product_cve_count {evidence.get(\"neural_product_cve_count\")}')
              elif evidence.get('neural_product_cve_count', 0) > 0 and evidence['tier'] not in ['validated_rct','validated_replication','demonstrated_lab','demonstrated_case']:
                  errors.append(
                      f'{tid}: holds {evidence["neural_product_cve_count"]} neural-product CVE(s) '
                      f'but is tiered {evidence["tier"]!r}, below demonstrated'
                  )
              if physics:
                  is_sentinel = physics.get('tier') == 'X'
                  is_no_gate = physics.get('tier_label') == 'no_physics_gate'
                  if is_sentinel != is_no_gate:
                      errors.append(
                          f'{tid}: tier {physics.get(\"tier\")!r} and tier_label '
                          f'{physics.get(\"tier_label\")!r} disagree; no_physics_gate must use tier \"X\"'
                      )
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print(f'All {len(d[\"techniques\"])} techniques valid')
          "

      - name: Check variants
        run: |
          python3 -c "
          import json, re, sys
          d = json.load(open('datalake/qtara-registrar.json'))
          technique_ids = {t['id'] for t in d['techniques']}
          dimensions = d['schema_extensions']['variants']['format']['differs_in']
          variants = d.get('variants', [])
          errors = []
          for v in variants:
              vid = v.get('id', 'UNKNOWN')
              if not re.fullmatch(r'QIF-T\d{4}-V\d{2}', vid):
                  errors.append(f'{vid}: variant id must be QIF-Tnnnn-Vnn')
              if vid in technique_ids:
                  errors.append(f'{vid}: a variant must not appear in techniques')
              if v.get('parent') not in technique_ids or not vid.startswith(str(v.get('parent')) + '-V'):
                  errors.append(f'{vid}: parent must be one existing technique whose id the variant id extends')
              if v.get('differs_in') not in dimensions:
                  errors.append(f'{vid}: differs_in is outside the closed vocabulary')
              if v.get('peer_review_status') != 'peer_reviewed' and (v.get('inherits_niss') or v['niss'].get('scoring_state') != 'unscored'):
                  errors.append(f'{vid}: a variant without a peer-reviewed source must be unscored')
          if d['statistics'].get('total_variants') != len(variants):
              errors.append('statistics.total_variants does not match the variants array')
          if d['statistics'].get('total_techniques') != len(d['techniques']):
              errors.append('statistics.total_techniques does not match the techniques array')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print(f'All {len(variants)} variants valid; {len(d[\"techniques\"])} techniques')
          "

      - name: Check SDK copy in sync
        run: |
          if [ -f datalake/qtara/src/qtara/data/qtara-registrar.json ]; then
            if ! diff -q datalake/qtara-registrar.json datalake/qtara/src/qtara/data/qtara-registrar.json > /dev/null 2>&1; then
              echo "::error::SDK bundled registrar is out of sync with source. Copy datalake/qtara-registrar.json to datalake/qtara/src/qtara/data/"
              exit 1
            fi
            echo "SDK copy in sync"
          else
            echo "::warning::SDK bundled registrar not found at datalake/qtara/src/qtara/data/qtara-registrar.json"
          fi

      - name: Check technique count matches timeline
        run: |
          python3 -c "
          import json
          reg = json.load(open('datalake/qtara-registrar.json'))
          timeline = json.load(open('src/data/qif-timeline.json'))
          reg_count = len(reg['techniques'])
          tl_count = timeline.get('stats', {}).get('threat_techniques', 0)
          if reg_count != tl_count:
              print(f'::warning::Registrar has {reg_count} techniques but timeline says {tl_count}. Run timeline-check.mjs --fix')
          else:
              print(f'Technique count in sync: {reg_count}')
          "

      - name: Check statistics block against the arrays
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('datalake/qtara-registrar.json'))
          s = d['statistics']
          errors = []
          if s['total_techniques'] != len(d['techniques']):
              errors.append(f\"total_techniques={s['total_techniques']} but techniques array holds {len(d['techniques'])}\")
          if s['total_tactics'] != len(d['tactics']):
              errors.append(f\"total_tactics={s['total_tactics']} but tactics array holds {len(d['tactics'])}\")
          if s['total_tactics'] != len(s['by_tactic']):
              errors.append(f\"total_tactics={s['total_tactics']} but by_tactic holds {len(s['by_tactic'])}\")
          if s['total_domains'] != len(d['domains']):
              errors.append(f\"total_domains={s['total_domains']} but domains array holds {len(d['domains'])}\")
          scoring = sum(s['by_scoring_state'].values())
          if scoring != len(d['techniques']):
              errors.append(f'by_scoring_state sums to {scoring}, not {len(d[\"techniques\"])}')
          status = sum(s['by_status'].values())
          if status != len(d['techniques']):
              errors.append(f'by_status sums to {status}, not {len(d[\"techniques\"])}')
          for e in errors:
              print(f'::error::{e}')
          # The declared domain codes are not referenced by any technique field;
          # tara_domain_primary uses a separate 12-value taxonomy. Advisory until
          # the two are reconciled. See DRBRYCE-QIF-CROSSREFERENCE.md item 4.
          declared = {x['code'] for x in d['domains']}
          used = {t.get('tara_domain_primary') for t in d['techniques']} - {None}
          if not (declared & used):
              print(f'::warning::domains array {sorted(declared)} is referenced by no technique; tara_domain_primary uses {sorted(used)}')
          sys.exit(1 if errors else 0)
          "

      - name: Check the paper's registry figures are not stale
        run: |
          python3 research/paper/scripts/generate_registry_stats.py --check \
            || { echo "::error::research/paper/generated/registry-stats.tex is stale against the registry. Run 'make stats' in research/paper/ and commit the result."; exit 1; }

      - name: Check frozen pages in publicDir for stale counts
        run: python3 src/scripts/verify/check_frozen_pages.py --github

      - name: Type check
        run: |
          npm ci --ignore-scripts 2>/dev/null || true
          npx tsc --noEmit 2>&1 || echo "::warning::TypeScript type check found issues"

      # Files derived from the registrar drift silently otherwise: the
      # Autodidactive lesson sat at 109 techniques against a 174-technique
      # registrar until someone read it.
      - name: Check registrar-derived files are current
        run: npm run generated:check
