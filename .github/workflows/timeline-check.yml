name: Timeline Staleness Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0  # full history for git log scan

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Run timeline check
        id: check
        continue-on-error: true
        run: node src/scripts/timeline-check.mjs --dry-run

      - name: Warn if stale
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning::QIF timeline stats appear stale. Run 'node src/scripts/timeline-check.mjs --fix' locally to update."
