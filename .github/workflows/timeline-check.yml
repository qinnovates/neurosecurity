name: Timeline Staleness Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0  # full history for git log scan

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Run timeline check
        id: check
        continue-on-error: true
        run: node src/scripts/timeline-check.mjs --dry-run

      - name: Warn if stale
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning::QIF timeline stats appear stale. Run 'node src/scripts/timeline-check.mjs --fix' locally to update."
