[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qtara"
version = "0.3.0"
authors = [
  { name="Qinnovate" },
]
description = "Threat Analysis & Risk Assessment (TARA) Framework for Neural Security"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0.0",
    "stix2>=3.0.0",
    "rich>=13.0.0",
]

[project.urls]
"Homepage" = "https://github.com/qinnovates/neurosecurity"
"Source" = "https://github.com/qinnovates/neurosecurity/tree/main/datalake/qtara"
"Bug Tracker" = "https://github.com/qinnovates/neurosecurity/blob/main/SECURITY.md"

[project.scripts]
qtara = "qtara.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qtara = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
